# Copy to sources.toml next to this skill (or to the path in the
# TRADING_IDEA_SOURCES environment variable) and edit. Nothing here is required:
# without it the skill uses web search and whatever market data tools exist.

[user]
timezone = "UTC"                 # all event times are shown in this timezone
base_currency = "USD"
home_central_bank = ""           # e.g. "National Bank of Kazakhstan"
markets = ["US"]                 # markets the user can trade
instruments_allowed = ["stock", "etf"]   # add "option", "leveraged_etf", "future" if used
broker_notes = ""                # e.g. "premarket access; options are expensive"

[scan]
extra_regions = []               # e.g. ["Kazakhstan", "EU"]
max_theses = 4

# One block per source. kind: web | rss | telegram | newsletter | api | file
# 'bias' is your own note on the source's slant, shown next to its summary.
[[sources]]
name = "Example macro newsletter"
kind = "rss"
location = "https://example.com/feed.xml"
focus = "rates, credit"
bias = ""

[[sources]]
name = "Example broker research"
kind = "telegram"
location = "@example_channel"   # needs a Telegram tool or an export file
focus = "local market, PMI"
bias = "broker house view"

[risk]
event_size_factor = 0.5          # geopolitical / commodity / single-event ideas
event_time_stop_days = 3         # trading days, unless hedged
leveraged_size_factor = 0.4
leveraged_max_days = 5           # 3x products
max_ticker_share = 0.30
max_correlated_positions = 2

[research]
parallel_subagents = true
subagent_timeout_minutes = 10

[schedule]
# Optional scheduled runs, in [user].timezone. Use your platform's scheduler
# (cron, Claude Code scheduled tasks, etc.) to invoke the skill at these times.
auto_record = false              # write scheduled ideas to the journal automatically
# premarket = "08:30"
# post_close = "16:15"
# daily_digest = "21:00"
