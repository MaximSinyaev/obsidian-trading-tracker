[project]
name = "agent-trading-journal"
version = "1.2.0"
description = "Trading journal for AI agents: deterministic P&L in local SQLite, imports, interactive dashboards, Obsidian export"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "jinja2>=3.1.0",
    "openpyxl>=3.1.0",
]
keywords = ["trading", "journal", "pnl", "obsidian", "claude", "agent-skill", "portfolio"]

[project.optional-dependencies]
yahoo = ["yfinance>=1.2.0"]

[project.urls]
Homepage = "https://github.com/MaximSinyaev/agent-trading-journal"

[project.scripts]
trade = "trading_tracker.cli:run"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "yfinance>=1.2.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_tracker"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
